name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------- quick checks ----------
  check-web:
    name: web (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build React console
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Ensure dist present for embed
        run: test -f web/dist/index.html

  # ---------- cross-platform tests & builds ----------
  build:
    name: ${{ matrix.name }}
    needs: check-web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: ohmyserial
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin: ohmyserial
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bin: ohmyserial
          - name: macos-x64
            # Cross-compile Intel target on Apple Silicon runners
            os: macos-latest
            target: x86_64-apple-darwin
            bin: ohmyserial
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: ohmyserial.exe
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bin: ohmyserial.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux serial deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI (embedded into binary)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Test
        run: cargo test --all-targets --target ${{ matrix.target }}

      - name: Release build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          STAGE="ohmyserial-${{ matrix.target }}"
          mkdir -p "dist/${STAGE}"
          BIN="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          cp "$BIN" "dist/${STAGE}/"
          cp README.md LICENSE ohmyserial.example.toml "dist/${STAGE}/" 2>/dev/null || true
          cp web/PROTOCOL.zh-TW.md "dist/${STAGE}/" 2>/dev/null || true
          cd dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "${STAGE}.zip" "${STAGE}"
          else
            tar -czf "${STAGE}.tar.gz" "${STAGE}"
          fi
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ohmyserial-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  # ---------- summary ----------
  ci-ok:
    name: all green
    needs: [check-web, build]
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI passed for all platforms"
