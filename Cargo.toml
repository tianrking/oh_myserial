[package]
name = "ohmyserial"
version = "0.1.0"
edition = "2021"
description = "Cross-platform open-source serial hub for humans and agents"
license = "MIT"
readme = "README.md"
repository = "https://github.com/tianrking/oh_myserial"
keywords = [
    "serial",
    "uart",
    "hub",
    "websocket",
    "embedded",
    "com-port",
    "tty",
    "agent",
    "multiplexer",
    "cross-platform",
]
categories = ["command-line-utilities", "network-programming", "asynchronous"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws", "macros"] }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["term", "fs", "poll"] }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.26"

[profile.release]
lto = true
codegen-units = 1
strip = true
