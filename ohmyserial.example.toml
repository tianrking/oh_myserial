# oh_myserial example — ONE real UART, MANY parallel consumers
#
# mental model:
#   real serial ──► hub ──┬── virtual serial (PTY) × N   → classic host tools
#                         ├── TCP :port × M              → many nc/scripts per port
#                         └── WebSocket /v1/stream × ∞   → many agents at once

[real]
path = "mock:demo"
# For exact USB identity, keep a display fallback path and uncomment:
# usb = { vid = 0x10c4, pid = 0xea60, serial_number = "board-01" }
# path = "/dev/cu.usbmodem14101"   # macOS
# path = "/dev/ttyUSB0"            # Linux
# path = "COM3"                    # Windows
baud = 115200
databits = 8
parity = "none"
stopbits = 1
flow = "none"
reconnect = true
reconnect_ms = 1000

[tx]
mode = "queue_by_line"
primary = "ui"
write_lock_ms = 3000
write_timeout_ms = 5000
max_frame_bytes = 65536
max_write_bytes = 65536
slow_client = "drop_oldest"
client_queue = 256
# Only used by slow_client = "block". A client still full after this deadline
# is disconnected so it cannot stall the serial owner indefinitely.
slow_block_ms = 1000

[api]
bind = "127.0.0.1:8787"
enabled = true
can_read = true
can_write = true
# Physical DTR/RTS/BREAK control; every request still needs a write lease.
can_control = false
# The URL-safe secret is read only from this environment variable, never from TOML.
# token_env = "OHMYSERIAL_API_TOKEN"
# Empty means same-origin browser access only. List exact origins when needed;
# wildcard CORS is intentionally rejected.
# cors_origins = ["https://serial-console.example.com"]
# Agents: ws://127.0.0.1:8787/v1/stream  (unlimited concurrent connections)
# List endpoints: GET http://127.0.0.1:8787/v1/endpoints
# Plaintext API and dedicated WebSocket binds are loopback-only even with a token.
# For remote access, use an SSH tunnel or a TLS reverse proxy to this listener.
# HTTP: Authorization: Bearer $OHMYSERIAL_API_TOKEN
# Browser WS: new WebSocket(url, ["bearer", token])

# ========== optional RFC2217 ==========
# Loopback-only legacy network serial server. It is unauthenticated by the
# protocol itself; use an SSH tunnel for remote clients. Line/control changes
# are disabled unless can_control = true and still use the Hub lease path.
[rfc2217]
enabled = false
bind = "127.0.0.1:7000"
can_read = true
can_write = true
can_control = false

# ========== bulk fan-out ==========
[fanout]
# macOS / Linux only: set to 2+ to create /tmp/ohmyserial-v0, v1, …
# (each GUI / program opens its own virtual serial)
# Windows: keep 0 and use TCP + WebSocket below.
pty_count = 0
pty_link_prefix = "/tmp/ohmyserial-v"
pty_name_prefix = "v"
pty_can_write = true
pty_can_read = true

# Two raw, unauthenticated TCP ports; EACH accepts many simultaneous clients.
# Keep these on loopback. For remote access, tunnel them over SSH instead of
# binding raw TCP to a LAN/WAN interface.
tcp_count = 2
tcp_host = "127.0.0.1"
tcp_base_port = 8788
tcp_name_prefix = "tcp"
tcp_can_write = true
tcp_can_read = true
# Binary bridge mode: each TCP read is an atomic TX unit (no line delimiter).
tcp_raw = false

# Optional second API/WS server:
# ws_binds = ["127.0.0.1:8790"]

# ========== explicit extras (optional) ==========
# [[clients]]
# type = "pty"
# name = "ui"
# link = "/tmp/ohmyserial-ui"
# can_write = true
# can_read = true

[ledger]
# Canonical v1 events are always kept in a bounded memory ring.
memory_events = 16384
memory_bytes = 33554432
stream_capacity = 1024
# Disk capture is opt-in. When enabled, the hub writes hashed, crash-recoverable
# NDJSON segments and never silently deletes old segments.
# directory = "./ohmyserial-ledger"
rotate_bytes = 67108864
fsync_each_event = false

[log]
mirror_console = true
format = "hex+text"
